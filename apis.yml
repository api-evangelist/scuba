aid: scuba
name: Scuba
description: Scuba (Scuba Analytics, formerly Interana) is a real-time behavioral and customer
  analytics platform for self-service exploration of large-scale event data, backed by Battery
  Ventures and DCVC. The company is rebranding to Behavure AI and extending its behavioral query
  engine to detect drift, explain decisions, and govern AI agents across models, systems, and
  users. Scuba publishes product user guides, admin guides, a glossary, dated release notes, and
  a Tableau connector at docs.scuba.io (now docs.behavure.ai), but does not currently expose a
  public developer REST API reference, SDKs, or machine-readable API specification.
